workflows:
  android-workflow:
    name: TaskFlow Android Build (Debug/Release APK & AAB)
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      android_signing:
        - keystore_credentials
      groups:
        - firebase_credentials
      vars:
        PACKAGE_NAME: "com.aistudio.taskflow"
      java: 17
    scripts:
      - name: Set up local.properties and permissions
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          chmod +x gradlew || true
      - name: Build Android Debug APK
        script: |
          ./gradlew assembleDebug
      - name: Build Android Release APK & Play Store Bundle (AAB)
        script: |
          if [ -n "$CM_KEYSTORE_PATH" ]; then
            export KEYSTORE_PATH="$CM_KEYSTORE_PATH"
            export STORE_PASSWORD="$CM_KEYSTORE_PASSWORD"
            export KEY_PASSWORD="$CM_KEY_PASSWORD"
          fi
          ./gradlew assembleRelease
          ./gradlew bundleRelease
    artifacts:
      - app/build/outputs/apk/**/*.apk
      - app/build/outputs/bundle/**/*.aab

  ios-workflow:
    name: TaskFlow iOS Build (Signed IPA)
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: com.aistudio.taskflow
      groups:
        - apple_credentials
      vars:
        XCODE_PROJECT: "ios/TaskFlowAI.xcodeproj"
        XCODE_SCHEME: "TaskFlowAI"
      xcode: latest
    scripts:
      - name: Set up code signing profiles
        script: |
          xcode-project use-profiles --project ios/TaskFlowAI.xcodeproj || true
      - name: Resolve Swift Package Dependencies
        script: |
          cd ios
          xcodebuild -resolvePackageDependencies -project TaskFlowAI.xcodeproj
      - name: Build Xcode Archive
        script: |
          cd ios
          xcodebuild archive \
            -project TaskFlowAI.xcodeproj \
            -scheme TaskFlowAI \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$CM_BUILD_DIR/build/ios/TaskFlowAI.xcarchive" \
            CODE_SIGN_STYLE="Automatic"
      - name: Package and Export Signed IPA
        script: |
          cd ios
          EXPORT_PLIST="${CM_EXPORT_OPTIONS_PLIST:-TaskFlowAI/Resources/ExportOptions.plist}"
          xcodebuild -exportArchive \
            -archivePath "$CM_BUILD_DIR/build/ios/TaskFlowAI.xcarchive" \
            -exportPath "$CM_BUILD_DIR/build/ios/ipa" \
            -exportOptionsPlist "$EXPORT_PLIST"
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/TaskFlowAI.xcarchive
