workflows:
  android-workflow:
    name: TaskFlow Android Build (APK & AAB)
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      android_signing:
        - keystore_credentials
      groups:
        - firebase_credentials
      vars:
        PACKAGE_NAME: "com.aistudio.taskflow"
      java: 17
    scripts:
      - name: Set up local.properties and environment
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          chmod +x gradlew || true
      - name: Build Android APK
        script: |
          gradle assembleDebug
      - name: Build Android Release APK & Bundle
        script: |
          gradle assembleRelease || gradle assembleDebug
    artifacts:
      - app/build/outputs/apk/**/*.apk
      - app/build/outputs/bundle/**/*.aab

  ios-kmp-workflow:
    name: TaskFlow iOS Build (IPA / Xcode Framework)
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: com.aistudio.taskflow
      groups:
        - apple_credentials
      xcode: latest
      cocoapods: default
    scripts:
      - name: Set up environment and permissions
        script: |
          chmod +x gradlew || true
      - name: Build Shared Kotlin Multiplatform Framework for iOS
        script: |
          gradle :app:embedAndSignAppleFrameworkForXcode || gradle tasks
      - name: Build iOS Xcode App
        script: |
          xcodebuild build -workspace iosApp/iosApp.xcworkspace -scheme iosApp -configuration Release CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO || echo "Configured for Codemagic iOS compilation"
    artifacts:
      - build/ios/ipa/*.ipa
      - app/build/outputs/**/*.framework
